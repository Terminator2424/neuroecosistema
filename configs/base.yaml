# Valores iniciales. Ninguno es definitivo: cada cambio relevante se registra en docs/bitacora.md
seed: 42

world:
  width: 800
  height: 600
  max_steps: 1500

plants:
  initial: 60
  max_plants: 80
  respawn_rate: 0.02      # probabilidad por paso de que aparezca una planta nueva
  energy_value: 30
  eat_radius: 10

prey:
  initial: 30
  max_speed: 3.0
  max_turn: 0.25          # radianes por paso
  start_energy: 100
  max_energy: 150
  energy_cost_base: 0.03  # costo por paso aunque no se mueva
  energy_cost_move: 0.05  # costo adicional proporcional a la velocidad
  vision_range: 150

predators:
  initial: 6
  max_speed: 3.1          # calibrado (D9): antes 3.4
  max_turn: 0.20
  start_energy: 150
  max_energy: 200
  energy_cost_base: 0.05
  energy_cost_move: 0.08
  vision_range: 180
  capture_radius: 8
  energy_gain_capture: 35  # calibrado (D9): antes 60

network:
  prey_hidden: [12, 8]
  predator_hidden: [10, 8]
  hidden_activation: tanh

evolution:
  population_size: 30
  generations: 100
  elite: 3
  tournament_size: 3
  mutation_rate: 0.1
  mutation_sigma: 0.2
  crossover_rate: 0.0     # 0 = solo mutación (el cruce entre redes suele ser dañino)
  episodes_per_genome: 3

fitness:
  variant_prey: mixta           # mixta | supervivencia
  variant_predator: mixta       # mixta | capturas
  prey_weight_survival: 0.7
  prey_weight_food: 0.3
  prey_food_ref: 8.0            # plantas por presa que cuentan como 100 % del componente de comida
  predator_weight_captures: 0.7
  predator_weight_energy: 0.3

training:
  prey_opponent: perseguidor    # depredador de referencia contra el que aprende la presa
  predator_opponent: reglas     # presa de referencia contra la que aprende el depredador
  validation_top_k: 5           # finalistas que se re-evalúan con semillas de validación
  validation_seeds: 10
  validation_offset: 900        # las semillas de validación son train_start + 900 en adelante

seeds:
  train_start: 1000
  eval_start: 5000
  eval_count: 30